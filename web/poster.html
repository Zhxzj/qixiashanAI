<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>游后日记 · 栖霞山小向导</title>
<link href="/css/app.css" rel="stylesheet"/>
<link href="/poster/poster.css" rel="stylesheet"/>
<link href="/poster/skill/css/palettes.css" rel="stylesheet"/>
<link href="/poster/skill/css/type.css" rel="stylesheet"/>
<link href="/poster/skill/css/base.css" rel="stylesheet"/>
<link href="/poster/ui-poster.css" rel="stylesheet"/></head>
<body class="poster-page">
<header class="topbar">

<nav class="topnav">
<a class="ghost" href="/">← 回到向导</a>
</nav>
<a class="ghost" href="/api/diagnostics" target="_blank">诊断</a><button class="ghost" id="exitApp">退出应用</button>
</header>
<main class="poster-layout">
<!-- 左：素材与游踪 -->
<section class="pcard pleft">
<div class="card">
<div class="card-title">① 今天的照片</div>
<div class="drop" id="dropZone">
<input accept="image/*,.heic,.heif" hidden="" id="fileInput" multiple="" type="file"/>
<div class="drop-text">把照片拖进来，或 <button class="link" id="pickBtn">选择文件</button></div>
<div class="muted">照片不落盘、不上传图床。有 GPS 本地匹配；可手工选点。最多 12 张，每张 25MB、4000 万像素；支持 JPG/PNG/WEBP。</div>
</div>
<label class="muted"><input id="cloudDetect" type="checkbox"/>允许将压缩照片发给 DeepSeek 识别地点（不勾选则仅本地候选）</label><div id="photoError" role="status"></div>
<div class="photo-grid" id="photoGrid"></div>
<details class="ui-poster-tools"><summary>照片工具</summary><button class="ghost" id="samplesBtn">用示例照片一键体验</button><button class="ghost" id="clearBtn">清空</button></details><div class="console-row">


</div>
</div>
<div class="card">
<div class="card-title">② 点位核对</div>
<div class="photo-list" id="photoList"></div>
<div class="pick-panel" hidden="" id="pickPanel">
<div class="muted" id="pickHint"></div>
<div class="pick-grid" id="pickGrid"></div>
</div>
</div>
<div class="card">
<div class="card-title">③ 出游记录</div>
<div class="trip-info muted" id="tripInfo">还没有游踪。先回向导页走一段，再来生成日记。</div>
<details class="ui-poster-tools"><summary>日记工具</summary><button id="replayBtn">回放小传</button><button class="ghost" id="recapBtn">刷新文案</button><button class="ghost" id="copyDiary">复制日记正文</button></details><div class="console-row">


</div>
<p id="hostTripNotice" role="status" hidden></p>
<div id="diaryBody" style="white-space:pre-wrap;line-height:1.8"></div>
<div class="replay-box" hidden="" id="replayBox"></div>
</div>
</section>
<!-- 中：画布 -->
<section class="pcard pcenter">
<div class="stage-wrap" id="stageWrap">
<div class="poster-stage" id="stage"></div>
<div class="stage-empty" id="stageEmpty">
<div class="t4">生成三张候选后在这里预览</div>
<div class="muted">点左侧「用示例照片一键体验」可以马上看效果</div>
</div>
</div>
<div class="stage-bar">
<button class="primary" id="genBtn">生成三张候选</button>
<button class="ghost" id="redrawBtn">换一批（换 seed）</button>
<button class="ghost" id="pngBtn">导出 PNG</button>
<span class="pill" id="qaBadge">质检待命</span>
</div>
</section>
<!-- 右：候选与质检 -->
<section class="pcard pright">
<div class="card">
<div class="card-title">候选（A 稳妥 / B 叙事 / C 惊喜）</div>
<div class="cand-row" id="candRow"></div>
<div class="muted" id="candHint">生成后点缩略图切换。</div>
</div>
<div class="card" hidden="">
<div class="card-title">色板</div>
<div class="pal-row" id="palRow"></div>
</div>
<div class="card">
<div class="card-title">质检（H1–H11）</div>
<div class="qa-box muted" id="qaBox">还没渲染。</div>
</div>
<div class="card">
<div class="card-title">取色联动</div>
<div class="muted" id="hintBox">渲染后显示照片主色命中情况。</div>
</div>
</section>
</main>
<script src="/js/session.js"></script>
<script src="/vendor/html-to-image.js"></script>
<script src="/vendor/exifr.min.js"></script>
<script src="/poster/skill/renderer/render.js"></script>
<script src="/poster/skill/renderer/grammar-mount.js"></script>
<script src="/poster/skill/renderer/grammar-scroll.js"></script>
<script src="/poster/skill/renderer/grammar-timeline.js"></script>
<script src="/poster/skill/renderer/grammar-collage.js"></script>
<script src="/poster/skill/renderer/grammar-poem.js"></script>
<script src="/poster/skill/renderer/grammar-map.js"></script>
<script src="/poster/skill/renderer/poster-qa.js"></script>
<script src="/poster/poster-app.js"></script>
<script>document.querySelector("#exitApp").onclick = () => Qixi.exit().catch(e => alert(e.message));</script>
</body>
</html>
