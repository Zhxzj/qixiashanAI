<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>栖霞山小向导</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">栖霞山小向导 <span class="sub">· 小栖</span></div>
    <div class="top-right">
      <span id="keyStatus" class="pill">未配置 Key</span>
      <a class="toplink" href="/poster.html">游后日记 →</a>
      <button id="keyBtn" class="ghost">API Key</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat-panel">
      <div id="messages" class="messages">
        <div class="note">演示提示：右侧控制台可以「前进」或「跳点」，模拟在山上走。</div>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatInput" autocomplete="off" placeholder="跟小栖说点什么，比如：我现在看到的是什么？">
        <button type="submit">发送</button>
      </form>
      <div class="quick" id="quickRow">
        <button class="chip-btn" data-q="明天上午到，想看红叶，也看千佛岩，怎么安排？">行前规划</button>
        <button class="chip-btn" data-q="我现在看到的是什么？">这是什么</button>
        <button class="chip-btn" data-q="我有点累了，想看红叶，今天天气怎么样，怎么走最快？">累了怎么走</button>
        <button class="chip-btn" data-q="帮我记住这里">记住这里</button>
        <button class="chip-btn" data-q="说重点">说重点</button>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <div class="card-title">示意地图 <span id="posInfo" class="muted"></span></div>
        <div id="mapBox" class="map-box"></div>
      </div>
      <div class="card">
        <div class="card-title">天气与红叶</div>
        <div id="conditions" class="cond">加载中…</div>
      </div>
      <div class="card">
        <div class="card-title">演示控制台</div>
        <div class="console-row">
          <button id="scriptBtn">▶ 走一遍剧本（3 分钟）</button>
        </div>
        <div id="scriptHint" class="muted script-hint" hidden></div>
        <div class="console-row">
          <button data-act="advance" data-val="50">前进 50m</button>
          <button data-act="advance" data-val="200">前进 200m</button>
        </div>
        <div class="console-row">
          <select id="poiSelect"></select>
          <button id="gotoBtn">跳到这里</button>
        </div>
        <div class="console-row">
          <button id="resetBtn" class="ghost">重置</button>
          <span id="stateInfo" class="muted"></span>
        </div>
      </div>
      <div class="card arrived" id="arrivedCard" style="display:none">
        <div class="card-title"><span id="arrivedName">到点播报</span>
          <span class="muted" id="arrivedPoi"> </span></div>
        <div id="arrivedText"></div>
        <div class="arrived-actions">
          <button id="playAgainBtn" class="ghost sm">再念一遍</button>
          <button id="stopVoiceBtn" class="ghost sm">别念了</button>
          <button id="askMoreBtn" class="ghost sm">讲讲这里</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">这一程</div>
        <div id="tripMini" class="muted">走到哪儿，这里就记到哪儿。</div>
        <div class="console-row">
          <button id="toPosterBtn">去写今天的日记 →</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="keyModal" class="modal" style="display:none">
    <div class="modal-box">
      <h3>DeepSeek API Key</h3>
      <input id="keyInput" type="password" placeholder="sk-…（只存本机 config.json）">
      <div class="modal-actions">
        <button id="keySave">保存并测试</button>
        <button id="keyClose" class="ghost">关闭</button>
      </div>
      <div id="keyMsg" class="muted"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
